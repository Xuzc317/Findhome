name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: 后端测试（离线解析 + 去重风险 + 接口契约）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 解析器离线测试（71 项，无需联网）
        run: python tests/test_parsers.py

      - name: 去重与风险评分测试（16 项）
        run: python tests/test_dedup_risk.py

      - name: 启动后端
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "后端已就绪"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/health

      - name: 接口契约与筛选闭环自检（31 项）
        run: python verify_api.py --base http://127.0.0.1:8000/api

  frontend:
    name: 前端构建检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 + 构建
        run: npm run build
